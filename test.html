<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Scroll</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }

      .other-section,
      .other-section-2 {
        height: 100vh;
        background-color: bisque;
      }

      .other-section-2 {
        background-color: rgb(199, 255, 150);
      }

      .services {
        background-color: burlywood;
        position: relative;
      }

      .services-container {
        height: 100vh;
        width: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 2rem;
      }

      .title {
        font-size: 2rem;
        position: sticky;
        top: 2rem;
        z-index: 10;
        background-color: burlywood;
      }

      .scroll-wrapper {
        margin-top: 3rem;
        height: 100%;
        overflow: hidden;
        width: 100%;
        position: relative;
      }

      .cards-container {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        will-change: transform;
      }

      .card {
        height: 200px;
        width: 200px;
        background-color: aqua;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <section class="other-section"></section>

    <section class="services">
      <div class="services-container">
        <h2 class="title">Our Solutions</h2>
        <div class="scroll-wrapper">
          <div class="cards-container">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="other-section-2"></section>

    <!-- GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- GSAP ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const container = document.querySelector(".cards-container");
      const services = document.querySelector(".services");

      gsap.to(container, {
        y: () => -(container.scrollHeight - window.innerHeight),
        ease: "none",
        scrollTrigger: {
          trigger: services,
          start: "top top",
          end: () => "+=" + (container.scrollHeight - window.innerHeight),
          scrub: true,
          pin: true,
          anticipatePin: 1,
          invalidateOnRefresh: true,
          markers: true,
        },
      });
    </script>
  </body>
</html>
