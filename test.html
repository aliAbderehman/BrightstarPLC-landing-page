<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .other-section {
        height: 100vh;
        background-color: bisque;
      }
      .other-section-2 {
        height: 250vh;
        background-color: rgb(199, 255, 150);
      }

      .services {
        /* background-color: burlywood; */
        overflow: hidden;
      }
      .services-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .card {
        height: 200px;
        width: 200px;
        background-color: aqua;

        margin-bottom: 2rem;
      }
      .cards-container {
        background-color: cadetblue;
        padding: 2rem;
      }

      .title {
        z-index: 6;
      }

      .scroll-wrapper {
        /* background-color: cornsilk; */
        padding: 4rem;
        /* height: 100vh; */
        height: fit-content;
        overflow: hidden;
        /* position: relative; */
      }
    </style>
  </head>
  <body>
    <section class="other-section"></section>
    <section class="services">
      <div class="services-container">
        <h2 class="title">Our Solutions</h2>

        <div class="scroll-wrapper">
          <div class="cards-container">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="other-section-2"></section>
    <!-- GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- GSAP ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const container = document.querySelector(".cards-container");
      const sectionServices = document.querySelector(".services");
      const scrollWrapper = document.querySelector(".scroll-wrapper");

      // const scrollHeight =
      //   container.getBoundingClientRect().height - window.innerHeight;
      const scrollDistance = sectionServices.offsetHeight - window.innerHeight;
      const wrapperDistance = scrollWrapper.offsetHeight - window.innerHeight;

      gsap.to(container, {
        yPercent: -100,
        ease: "none",
        scrollTrigger: {
          trigger: sectionServices,
          start: "top top",
          end: () => "+=" + container.offsetHeight,
          scrub: true,
          pin: sectionServices,
          pinSpacing: false, // Critical for your layout
          anticipatePin: 1,
          invalidateOnRefresh: true,

          markers: true, // Enable to debug
        },
      });
    </script>
  </body>
</html>
