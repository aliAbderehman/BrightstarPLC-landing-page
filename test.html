<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beautiful Birthday Cake with Blow Out Effect</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(135deg, #b381d6 0%, #c187aa 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        transition: background 1s ease;
        padding: 40px 20px 20px 20px; /* added top padding for better spacing */
      }

      .cake-container {
        /* position: relative; */
        width: 360px;
        height: 280px;
        /* margin-top: 30vh; */
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }

      .instruction {
        position: relative;
        top: -60px;
        width: 100%;
        text-align: center;
        font-size: 1.6rem;
        color: #fff3a3;
        font-weight: 600;
        text-shadow: 1px 1px 4px #b07f00;
        user-select: none;
        pointer-events: none;
      }

      /* Cake base */
      .cake {
        position: relative;
        width: 320px;
        height: 180px;
        background: linear-gradient(145deg, #ffb8b8, #ff6f91);
        border-radius: 30px 30px 50px 50px;
        box-shadow: inset 0 8px 20px rgba(255, 255, 255, 0.5),
          0 8px 15px rgba(0, 0, 0, 0.15);
        /* margin-top: 40px;  */
      }

      /* Icing on top */
      .icing {
        position: absolute;
        top: 0;
        width: 320px;
        height: 60px;
        background: linear-gradient(135deg, #fff1f3 0%, #ffcee4 100%);
        border-radius: 30px 30px 0 0;
        box-shadow: inset 0 8px 15px rgba(255, 255, 255, 0.9);
      }

      /* Cake layers shading */
      .layer {
        position: absolute;
        bottom: 0;
        width: 320px;
        height: 90px;
        background: linear-gradient(145deg, #f8a5c2, #e6678e);
        border-radius: 0 0 50px 50px;
        box-shadow: inset 0 -6px 15px rgba(0, 0, 0, 0.2);
      }

      /* Cake plate */
      .plate {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 380px;
        height: 30px;
        background: linear-gradient(145deg, #f3d7d7, #b88a8a);
        border-radius: 100px / 20px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      }

      /* Candles container */
      .candles {
        /* position: absolute; */
        /* bottom: 100%;  */
        /* left: 50%; */
        /* transform: translateX(-50%); */
        width: 270px;
        display: flex;
        justify-content: space-between;
        padding: 0 10px;
        /* background-color: #b83250; */
      }

      /* Single candle */
      .candle {
        position: relative;
        width: 18px;
        height: 65px;
        background: linear-gradient(145deg, #fce38a, #f38181);
        border-radius: 5px;
        box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.6),
          0 3px 4px rgba(0, 0, 0, 0.15);
      }

      /* Candle wick */
      .wick {
        position: absolute;
        top: -12px;
        left: 50%;
        width: 3px;
        height: 10px;
        background: #3b2e2e;
        border-radius: 1.5px;
        transform: translateX(-50%);
        box-shadow: 0 0 3px #2b1e1e;
      }

      /* Flame */
      .flame {
        position: absolute;
        top: -38px;
        left: 50%;
        width: 18px;
        height: 30px;
        pointer-events: none;
        filter: drop-shadow(0 0 6px #ffb347);
        transform: translateX(-50%);
        animation: flicker 1.3s infinite;
        opacity: 1;
        transition: opacity 1s ease;
      }

      .flame svg path.outer {
        fill: #ffae42;
        filter: url(#glow);
        animation: flickerOuter 1.3s infinite alternate;
      }

      .flame svg path.inner {
        fill: #fff5c3;
        animation: flickerInner 1.3s infinite alternate;
      }

      /* Flicker animations */
      @keyframes flicker {
        0%,
        100% {
          transform: translateX(-50%) scale(1) translateY(0);
        }
        50% {
          transform: translateX(calc(-50% + 1px)) scale(1.1) translateY(-1.5px);
        }
      }

      @keyframes flickerOuter {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.75;
        }
      }

      @keyframes flickerInner {
        0%,
        100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
      }

      /* Birthday text */
      .birthday-text {
        position: absolute;
        top: -70px;
        width: 100%;
        text-align: center;
        font-size: 3rem;
        color: #ff4d6d;
        font-weight: 700;
        text-shadow: 2px 2px 5px #b83250;
        user-select: none;
      }

      /* Confetti container */
      .confetti-container {
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: visible;
        z-index: 10;
      }

      .confetti {
        position: absolute;
        width: 10px;
        height: 14px;
        background-color: #ffcc00;
        opacity: 0.9;
        transform-origin: center;
        animation: confetti-fall linear forwards;
        border-radius: 2px;
      }

      @keyframes confetti-fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(120vh) rotate(720deg);
          opacity: 0;
        }
      }

      /* Message text */
      .message {
        max-width: 450px;
        margin-top: 30px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px 25px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
        font-size: 1.25rem;
        line-height: 1.6;
        color: #b83250;
        font-style: italic;
        text-align: center;
        user-select: none;
      }

      .message strong {
        display: block;
        margin-bottom: 15px;
        font-size: 1.6rem;
        color: #ff4d6d;
      }

      .fade-out {
        opacity: 0;
        transition: opacity 2s ease;
        pointer-events: none;
      }

      .final-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2.5rem;
        color: #fff;
        text-shadow: 2px 2px 6px #000;
        opacity: 0;
        transition: opacity 2s ease;
      }
    </style>
  </head>
  <body>
    <div
      class="cake-container"
      role="img"
      aria-label="A beautiful birthday cake with candles"
    >
      <div class="instruction">Blow the candles to make a wish! 🎉</div>
      <div class="birthday-text">Happy Birthday!</div>
      <div class="candles" aria-label="Candles on cake">
        <div class="candle">
          <div class="wick"></div>
          <div class="flame" aria-hidden="true">
            <svg
              viewBox="0 0 20 30"
              width="20"
              height="30"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                  <feDropShadow
                    dx="0"
                    dy="0"
                    stdDeviation="2"
                    flood-color="#ffb347"
                    flood-opacity="0.7"
                  />
                </filter>
              </defs>
              <path
                class="outer"
                d="M10 0c-3 5-5 12-5 18a5 5 0 0 0 10 0c0-6-2-13-5-18z"
              />
              <path
                class="inner"
                d="M10 5c-1 2-1.5 5-1.5 7a1.5 1.5 0 0 0 3 0c0-2-0.5-5-1.5-7z"
              />
            </svg>
          </div>
        </div>

        <div class="candle">
          <div class="wick"></div>
          <div class="flame" aria-hidden="true">
            <svg
              viewBox="0 0 20 30"
              width="20"
              height="30"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                  <feDropShadow
                    dx="0"
                    dy="0"
                    stdDeviation="2"
                    flood-color="#ffb347"
                    flood-opacity="0.7"
                  />
                </filter>
              </defs>
              <path
                class="outer"
                d="M10 0c-3 5-5 12-5 18a5 5 0 0 0 10 0c0-6-2-13-5-18z"
              />
              <path
                class="inner"
                d="M10 5c-1 2-1.5 5-1.5 7a1.5 1.5 0 0 0 3 0c0-2-0.5-5-1.5-7z"
              />
            </svg>
          </div>
        </div>

        <div class="candle">
          <div class="wick"></div>
          <div class="flame" aria-hidden="true">
            <svg
              viewBox="0 0 20 30"
              width="20"
              height="30"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                  <feDropShadow
                    dx="0"
                    dy="0"
                    stdDeviation="2"
                    flood-color="#ffb347"
                    flood-opacity="0.7"
                  />
                </filter>
              </defs>
              <path
                class="outer"
                d="M10 0c-3 5-5 12-5 18a5 5 0 0 0 10 0c0-6-2-13-5-18z"
              />
              <path
                class="inner"
                d="M10 5c-1 2-1.5 5-1.5 7a1.5 1.5 0 0 0 3 0c0-2-0.5-5-1.5-7z"
              />
            </svg>
          </div>
        </div>
      </div>

      <div class="cake">
        <div class="icing"></div>
        <div class="layer"></div>
        <div class="plate"></div>
      </div>
    </div>

    <div class="message" aria-label="Birthday message">
      <strong>Happy Birthday, Hildu!</strong>
      Happy Birthday my dear..<br />
      May your day be filled with happiness, love, and sweet memories. You
      deserve the best..
    </div>

    <div class="confetti-container"></div>
    <!-- <div class="final-message">With love, from Lazar ❤️</div> -->

    <script>
      // Confetti logic
      const confettiContainer = document.querySelector(".confetti-container");

      function createConfettiPiece() {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.backgroundColor = `hsl(${
          Math.random() * 360
        }, 90%, 60%)`;
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.top = `-10px`;
        confetti.style.width = `${5 + Math.random() * 7}px`;
        confetti.style.height = `${8 + Math.random() * 10}px`;
        confetti.style.animationDuration = `${3 + Math.random() * 2}s`;
        confetti.style.animationDelay = `0s`;
        confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
        confettiContainer.appendChild(confetti);

        confetti.addEventListener("animationend", () => {
          confetti.remove();
        });
      }

      function launchConfetti() {
        const count = 70;
        for (let i = 0; i < count; i++) {
          setTimeout(createConfettiPiece, i * 20);
        }
      }

      // Candle blow logic
      const candles = document.querySelectorAll(".flame");
      let blownOut = false;

      async function startMicListening() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Sorry, your browser does not support microphone input.");
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          const audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(stream);
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          const dataArray = new Uint8Array(analyser.frequencyBinCount);

          function detectBlow() {
            analyser.getByteTimeDomainData(dataArray);
            let max = 0;
            for (let i = 0; i < dataArray.length; i++) {
              if (dataArray[i] > max) max = dataArray[i];
            }
            if (max > 180 && !blownOut) {
              blownOut = true;
              blowOutCandles();
            }
            requestAnimationFrame(detectBlow);
          }

          detectBlow();
        } catch (err) {
          alert("Microphone access denied or error: " + err.message);
        }
      }

      function blowOutCandles() {
        candles.forEach((flame) => {
          flame.style.opacity = "0";
        });

        document.body.style.background = "#252525";
        launchConfetti();

        setTimeout(() => {
          document.body.style.background =
            "linear-gradient(135deg, #6E0074FF 0%, #B7479DFF 100%)";

          // Fade out cake, message, etc
          document.querySelector(".cake-container").classList.add("fade-out");
          document.querySelector(".message").classList.add("fade-out");

          // Show final message
          const finalMsg = document.querySelector(".final-message");
          setTimeout(() => {
            finalMsg.style.opacity = "1";
          }, 2000);
        }, 5000);
      }

      startMicListening();
    </script>
  </body>
</html>
